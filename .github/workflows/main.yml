name: Build and test Group16-DevNexus

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package

      - name: Run Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Run continent country report
        run: docker compose run --rm app report02 Asia

      - name: Run region country report
        run: docker compose run --rm app report03 "Eastern Asia"

      - name: Run world Top N country report
        run: docker compose run --rm app report04 10

      - name: Run continent Top N country report
        run: docker compose run --rm app report05 Asia 10

      - name: Clean up
        if: always()
        run: docker compose down -v
