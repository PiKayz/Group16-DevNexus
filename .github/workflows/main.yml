name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Compile with Maven
        run: mvn compile
      - name: Build Docker Image
        run: docker build -t exampleimage .
      - name: Run image
        run: docker run --name examplecontainer -d exampleimage
      - name: view logs
        run: docker logs -f examplecontainer
