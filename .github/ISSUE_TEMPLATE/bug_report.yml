name: Bug report
description: Report a reproducible problem in Group16-DevNexus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please check for an existing issue first.
        Do not include passwords, access tokens, private data or unredacted connection strings in logs.
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Country reports (1-6)
        - City reports (7-16)
        - Capital reports (17-22)
        - Population breakdowns (23-25)
        - Population totals (26-31)
        - Language report (32)
        - World database or Docker Compose
        - Maven, tests or GitHub Actions
        - Other
    validations:
      required: true
  - type: input
    id: report-number
    attributes:
      label: Report number
      description: Enter 1-32 if applicable; otherwise enter N/A.
      placeholder: "23 or N/A"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Give the release tag (for example v0.1.0.2) or commit SHA.
      placeholder: "v0.1.0.2"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Docker Compose
        - IntelliJ IDEA
        - GitHub Actions
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, report parameters and relevant World database inputs.
      placeholder: |
        1. Start the application with ...
        2. Run report ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only sanitized log excerpts. Attach screenshots if useful.
      render: shell
    validations:
      required: false
