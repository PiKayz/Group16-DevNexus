services:
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://devnexus-db:3306/world
      DB_USER: devnexus
      DB_PASSWORD: DevNexusApp2026
    depends_on:
      - devnexus-db

  devnexus-db:
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: "DevNexusRoot2026"
      MYSQL_DATABASE: "world"
      MYSQL_USER: "devnexus"
      MYSQL_PASSWORD: "DevNexusApp2026"
    ports:
      - "33060:3306"
    volumes:
      - world-data:/var/lib/mysql

volumes:
  world-data: